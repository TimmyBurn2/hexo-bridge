# Minor and patch updates arrive grouped once a month; a major version comes
# alone, so a breaking upgrade is never hidden in a bundle.
version: 2
updates:
    - package-ecosystem: uv
      directory: /
      schedule:
          interval: monthly
      commit-message:
          prefix: build(deps)
      groups:
          dependencies:
              update-types: [minor, patch]
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: monthly
      commit-message:
          prefix: ci(deps)
      groups:
          actions:
              update-types: [minor, patch]
