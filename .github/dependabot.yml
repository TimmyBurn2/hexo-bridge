version: 2
updates:
    - package-ecosystem: uv
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: build(deps)
      groups:
          dependencies:
              patterns: ["*"]
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: ci(deps)
      groups:
          actions:
              patterns: ["*"]
